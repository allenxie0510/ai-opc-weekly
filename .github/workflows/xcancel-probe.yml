name: XCancel Whitelist Probe (TEMP)
on:
  push:
    paths:
      - '.github/workflows/xcancel-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe xcancel placeholder RSS
        run: |
          echo '=== GET /tbpn/rss ==='
          curl -s -A 'FreshRSS/1.24.0 (Linux; https://freshrss.org)' -w '\n__HTTP:%{http_code}\n' --max-time 20 https://xcancel.com/tbpn/rss

      - name: Probe xcancel homepage / about
        run: |
          echo '=== GET / ==='
          curl -s -A 'FreshRSS/1.24.0 (Linux; https://freshrss.org)' -w '\n__HTTP:%{http_code}\n' --max-time 20 https://xcancel.com/ | head -c 5000
          echo
          echo '=== GET /about ==='
          curl -s -A 'FreshRSS/1.24.0 (Linux; https://freshrss.org)' -w '\n__HTTP:%{http_code}\n' --max-time 20 https://xcancel.com/about | head -c 5000
