name: Debug Radar Data (temporary)
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check anon read after policy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "== anon key 查 published =="
          curl -s "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/radar_items?select=status,score,title&status=eq.published&limit=3" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -w "\nHTTP %{http_code}\n" | head -c 1200
          echo ""
          echo "== anon key 查全部 =="
          curl -s "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/radar_items?select=status&limit=10" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" | head -c 600
