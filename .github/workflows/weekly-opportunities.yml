name: Weekly Opportunities

# 机会生产线：每周三 09:23 北京时间（UTC 01:23）自动跑一轮，
# 也可 Actions 页面手动触发（workflow_dispatch）。
# 两段式：近 7 天已发布雷达信号聚类（≥3 信号成机会）→ 逐机会联网深研，
# 产出 OPC Score / Evidence Grade / Recommendation 草稿，写入 opportunities 表待审。

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * 3'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate opportunity drafts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: node scripts/generate-opportunities.mjs
