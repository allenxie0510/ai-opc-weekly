name: Weekly Newsletter

on:
  schedule:
    # 主触发：每周一 08:05 北京时间 (00:05 UTC)，避开 GitHub Actions 周一早高峰
    - cron: '5 0 * * 1'
    # 备用触发：09:05 / 10:05 / 11:05 / 12:05 北京时间，多时段确保至少一个能跑
    - cron: '5 1 * * 1'
    - cron: '5 2 * * 1'
    - cron: '5 3 * * 1'
    - cron: '5 4 * * 1'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    # 如果本周已生成过（slug 已存在），跳过备用触发
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check if already published this week
        id: check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          YEAR=$(date +%Y)
          WEEK=$(date -u +%V)
          SLUG="${YEAR}-w${WEEK,,}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lamkpavsvuhqhkknkaxc.supabase.co/rest/v1/weekly_issues?slug=eq.${SLUG}&select=id" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          if [ "$STATUS" = "200" ]; then
            BODY=$(curl -s \
              "https://lamkpavsvuhqhkknkaxc.supabase.co/rest/v1/weekly_issues?slug=eq.${SLUG}&select=id" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
            if [ "$BODY" = "[]" ]; then
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "本周尚未生成，继续执行"
            else
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "本周已生成，跳过"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "查询失败($STATUS)，继续执行"
          fi
      - name: Generate & Publish
        if: steps.check.outputs.skip != 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node scripts/generate-weekly.mjs
