name: Weekly Newsletter

on:
  schedule:
    # 主触发：每周一 08:05 北京时间 (00:05 UTC)，避开 GitHub Actions 周一早高峰
    - cron: '5 0 * * 1'
    # 备用触发：09:05 / 10:05 / 11:05 / 12:05 北京时间，多时段确保至少一个能跑
    - cron: '5 1 * * 1'
    - cron: '5 2 * * 1'
    - cron: '5 3 * * 1'
    - cron: '5 4 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh source pool
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: node scripts/fetch-sources.mjs
      - name: Generate or supplement weekly draft
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          WEEKLY_DRAFT: 'true'  # 周一自动生成先入草稿，人工审核后到 Supabase 改 published
        run: node scripts/generate-weekly.mjs
