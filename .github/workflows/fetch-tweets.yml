name: Fetch X Tweets (Nitter → Supabase)

on:
  schedule:
    - cron: '0 */2 * * *'  # 每2小时
  workflow_dispatch:
    inputs:
      target_account:
        description: '可选：只抓取一个已追踪的 X 用户名（不含 @），用于媒体回填/诊断'
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node version
        run: node -v && npm -v

      - name: Check secrets exist
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "❌ 缺少 NEXT_PUBLIC_SUPABASE_URL"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "❌ 缺少 SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          echo "✅ Secrets OK"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install dependencies
        run: npm ci 2>&1

      - name: Fetch RSS feeds & upsert to Supabase
        run: node scripts/fetch-tweets.mjs 2>&1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FETCH_DEBUG: ${{ vars.FETCH_DEBUG || '0' }}
          FETCH_ACCOUNT: ${{ inputs.target_account || '' }}
