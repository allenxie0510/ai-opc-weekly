name: Fetch X Tweets (Nitter → Supabase)
run-name: X sync / ${{ inputs.target_account || 'all' }}

on:
  schedule:
    - cron: '17 */4 * * *'  # 每 4 小时错峰，降低免费共享来源负载；GitHub schedule 仍可能延迟
  workflow_dispatch:
    inputs:
      target_account:
        description: '可选：只抓取一个已追踪的 X 用户名（不含 @），用于媒体回填/诊断'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fetch-x-tweets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node version
        run: node -v && npm -v

      - name: Check secrets exist
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "❌ 缺少 NEXT_PUBLIC_SUPABASE_URL"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "❌ 缺少 SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          echo "✅ Secrets OK"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install dependencies
        run: npm ci 2>&1

      - name: Fetch RSS feeds & upsert to Supabase
        run: node scripts/fetch-tweets.mjs 2>&1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FETCH_DEBUG: ${{ vars.FETCH_DEBUG || '0' }}
          FETCH_ACCOUNT: ${{ inputs.target_account || '' }}

      - name: Translate latest X sources into Chinese
        if: ${{ !cancelled() }}
        run: npx tsx scripts/news/translate-tweets.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}

      - name: Review substantive X posts for editorial queue (never publish)
        if: ${{ !cancelled() }}
        run: npm run news:generate -- --x-only
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-editorial-audit
          path: output/news-audit/
          retention-days: 14
