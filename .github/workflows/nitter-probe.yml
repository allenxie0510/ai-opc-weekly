name: Nitter Instance Probe (TEMP)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe instances
        run: |
          UA='FreshRSS/1.24.0 (Linux; https://freshrss.org)'
          for inst in xcancel.com nitter.net nitter.poast.org nitter.privacyredirect.com lightbrd.com nitter.space nitter.tiekoetter.com nuku.trabun.org nitter.catsarch.com nitter.kareem.one; do
            for user in tbpn shadcn; do
              url="https://$inst/$user/rss"
              out=$(curl -s -m 15 -H "User-Agent: $UA" -w '\n__HTTP:%{http_code}' "$url" 2>&1)
              code=$(echo "$out" | grep -o '__HTTP:[0-9]*' | cut -d: -f2)
              body=$(echo "$out" | sed 's/__HTTP:[0-9]*$//')
              items=$(echo "$body" | grep -c '<item>' || true)
              title=$(echo "$body" | grep -o '<title>[^<]*</title>' | head -2 | tail -1 | sed 's/<[^>]*>//g' | cut -c1-80)
              echo "== $inst / $user → HTTP $code, items=$items, title=[$title]"
            done
          done
