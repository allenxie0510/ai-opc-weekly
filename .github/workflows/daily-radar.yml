name: Daily Radar

on:
  schedule:
    # 每天北京时间 06:47 (22:47 UTC)，避开整点/半点高峰
    - cron: '47 22 * * *'
    # 每天北京时间 19:47 (11:47 UTC) 傍晚补一轮
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只评估并输出审核报告，不新增信号草稿（素材池仍会刷新）'
        type: boolean
        default: false

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    env:
      EDITORIAL_RESEARCH_ENABLED: ${{ vars.EDITORIAL_RESEARCH_ENABLED }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch sources
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: node scripts/fetch-sources.mjs
      - name: Generate radar items
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          RADAR_AUTO_PUBLISH: 'false'
          RADAR_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/generate-radar.mjs
      - name: Upload radar selection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-audit
          path: radar-audit.json
          if-no-files-found: warn
          retention-days: 14
