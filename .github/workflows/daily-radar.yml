name: Daily Radar

on:
  schedule:
    # 每天北京时间 06:47 (22:47 UTC)，避开整点/半点高峰
    - cron: '47 22 * * *'
    # 每天北京时间 19:47 (11:47 UTC) 傍晚补一轮
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      readiness_only:
        description: '仅检查数据库迁移与队列负荷，不抓取、不生成。'
        type: boolean
        default: false
      dry_run:
        description: '试跑：不写后台草稿。要在后台审核请保持不勾选。'
        type: boolean
        default: false

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    env:
      EDITORIAL_RESEARCH_ENABLED: ${{ vars.EDITORIAL_RESEARCH_ENABLED }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Editorial schema readiness
        if: inputs.readiness_only == true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-editorial-readiness.mjs
      - uses: actions/cache@v4
        if: inputs.readiness_only != true
        with:
          path: .cache/editorial-ingestion
          key: radar-review-v5-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-review-v5-${{ github.ref_name }}-
      - name: Fetch sources
        if: inputs.readiness_only != true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: node scripts/fetch-sources.mjs
      - name: Generate radar items
        if: inputs.readiness_only != true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          RADAR_AUTO_PUBLISH: 'false'
          RADAR_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/generate-radar.mjs
      - name: Verify backend delivery
        if: inputs.readiness_only != true && inputs.dry_run != true && vars.EDITORIAL_RESEARCH_ENABLED == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-editorial-readiness.mjs
      - name: Upload radar selection audit
        if: always() && inputs.readiness_only != true
        uses: actions/upload-artifact@v4
        with:
          name: radar-audit
          path: radar-audit.json
          if-no-files-found: warn
          retention-days: 14
