<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f7f7f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1f2937">
    <div style="max-width:520px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #e5e7eb;border-radius:16px">
      <div style="font-size:13px;font-weight:700;letter-spacing:.08em;color:#6b7280">AI OPC</div>
      <h1 style="margin:16px 0 8px;font-size:24px">方向探测器登录验证码</h1>
      <p style="margin:0 0 24px;line-height:1.7;color:#4b5563">请回到刚才的浏览器页面，输入下面的 6 位验证码：</p>
      <div style="padding:18px 16px;border-radius:12px;background:#f3f4f6;text-align:center;font-size:32px;font-weight:800;letter-spacing:.28em;font-variant-numeric:tabular-nums">{{ .Token }}</div>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.7;color:#6b7280">验证码仅可使用一次。若这不是你的操作，可以忽略本邮件。</p>
    </div>
  </body>
</html>
